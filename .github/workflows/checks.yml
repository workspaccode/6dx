name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Dart: analyzer + widget/unit tests
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Cloud Functions: build-time type check (the deploy itself needs a
  # Firebase project, so CI verifies compilation only).
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

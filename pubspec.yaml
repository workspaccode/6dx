name: sixdx
description: 6DX - mobile & web project management app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.1
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  go_router: ^18.1.2
  auto_route: ^11.2.0

  dio: ^5.7.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0

  freezed_annotation: ^3.1.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  awesome_notifications: ^0.12.1

  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  gap: ^3.0.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.7.1
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3
  riverpod_generator: ^4.0.9
  auto_route_generator: ^10.6.0
  flutter_gen_runner: ^5.15.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf




